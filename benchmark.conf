# =============================================================================
# benchmark.conf
# =============================================================================

# ローカル結果保存先
BASE_DIR="${HOME}/benchmark"

# GitHubリポジトリ
GITHUB_REPO_DIR="${HOME}/Laboratory-Data-File"

# CPU・メモリ・fioの既定回数（各スクリプトの --runs で上書き可能）
BENCHMARK_RUNS=10

# =============================================================================
# sysbench
# =============================================================================

# 空欄の場合は nproc
SYSBENCH_THREADS=4
# Linux/guest内で見える論理CPU番号。空欄なら固定しない
BENCHMARK_CPU_CORES="8,10,12,14"


SYSBENCH_CPU_MAX_PRIME=20000
SYSBENCH_CPU_TIME=60
SYSBENCH_MEMORY_TOTAL_SIZE="10G"

# =============================================================================
# fio
# =============================================================================

FIO_SIZE="1G"
FIO_RUNTIME=30

# =============================================================================
# iperf3
# =============================================================================

IPERF_SERVER_IP="192.168.50.65"
IPERF_DURATION=30
# iperf3は既定で1回。--runs 10で10回実行
IPERF_RUNS=1
# TCP→UDP間、および次の回のTCP開始前の待機秒数
IPERF_INTERVAL_SECONDS=10
# 初回失敗後の最大再試行回数と待機秒数
IPERF_RETRIES=3
IPERF_RETRY_INTERVAL_SECONDS=10

# =============================================================================
# Git
# =============================================================================

GIT_REMOTE="origin"
GIT_BRANCH="main"
