# =============================================================================
# benchmark.conf
# =============================================================================

# ローカル結果保存先
BASE_DIR="${HOME}/benchmark"

# GitHubリポジトリ
GITHUB_REPO_DIR="${HOME}/Laboratory-Data-File"

# 各ベンチマークの実行回数
BENCHMARK_RUNS=10

# =============================================================================
# sysbench
# =============================================================================

# 空欄の場合は nproc
SYSBENCH_THREADS=

SYSBENCH_CPU_MAX_PRIME=20000
SYSBENCH_CPU_TIME=60
SYSBENCH_MEMORY_TOTAL_SIZE="10G"

# =============================================================================
# fio
# =============================================================================

FIO_SIZE="1G"
FIO_RUNTIME=30

# =============================================================================
# iperf3
# =============================================================================

IPERF_SERVER_IP="192.168.50.65"
IPERF_DURATION=30

# =============================================================================
# Git
# =============================================================================

GIT_REMOTE="origin"
GIT_BRANCH="main"