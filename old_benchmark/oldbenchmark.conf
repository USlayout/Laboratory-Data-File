# =============================================================================
# benchmark.conf
# 共通設定
# =============================================================================

# ローカルの生データ保存先
BASE_DIR="${HOME}/benchmark"

# GitHubリポジトリ
GITHUB_REPO_DIR="${HOME}/Laboratory-Data-File"

# =============================================================================
# sysbench
# =============================================================================

# 空欄なら nproc を使用
SYSBENCH_THREADS=

SYSBENCH_CPU_MAX_PRIME=20000
SYSBENCH_CPU_TIME=60
SYSBENCH_MEMORY_TOTAL_SIZE="10G"

# =============================================================================
# fio
# =============================================================================

FIO_SIZE="1G"
FIO_RUNTIME=30

# =============================================================================
# iperf3
# =============================================================================

IPERF_SERVER_IP="192.168.1.100"
IPERF_DURATION=30

# =============================================================================
# Git
# =============================================================================

GIT_REMOTE="origin"
GIT_BRANCH="main"